<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOYNEXTDOOR 記憶資料庫｜管理後台</title>

<style>
:root{
  --blue:#01A3DB;
  --dark:#08799f;
  --light:#e9f9ff;
  --bg:#f5fbfd;
  --text:#17343e;
  --gray:#71868e;
  --line:#dcecf2;
  --danger:#e85d68;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
  "PingFang TC","Microsoft JhengHei",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#eafaff,#f7fcfe);
}
.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px 24px;
  border-radius:26px;
  box-shadow:0 15px 45px rgba(1,163,219,.12);
}
.logo{
  width:62px;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--blue);
  color:#fff;
  border-radius:19px;
  font-size:28px;
  margin-bottom:18px;
}
.login-box h1{margin:0 0 7px;font-size:24px}
.login-box p{margin:0 0 24px;color:var(--gray);font-size:14px}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}
.input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fbfeff;
  padding:12px 13px;
  outline:none;
}
.input{margin-bottom:15px}
textarea{min-height:130px;resize:vertical}
.input:focus,textarea:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(1,163,219,.1);
}
.primary-btn,.add-btn,.save-btn{
  border:0;
  background:var(--blue);
  color:#fff;
  border-radius:12px;
  padding:12px 16px;
  font-weight:800;
}
.primary-btn{width:100%}
.message{
  text-align:center;
  color:var(--danger);
  font-size:14px;
  margin-top:12px;
}

.admin-page{display:none;min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.topbar-title{font-weight:800}
.topbar-sub{color:var(--gray);font-size:12px;margin-top:3px}
.logout{
  border:1px solid var(--line);
  background:#fff;
  color:var(--gray);
  border-radius:10px;
  padding:8px 12px;
}
.container{
  width:min(1100px,100%);
  margin:auto;
  padding:18px 14px 50px;
}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
  margin-bottom:18px;
}
.tab{
  flex:none;
  border:1px solid var(--line);
  background:#fff;
  color:var(--gray);
  border-radius:12px;
  padding:10px 14px;
}
.tab.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}
.panel{display:none}
.panel.active{display:block}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:18px;
}
.section-head h2{margin:0;font-size:22px}
.section-head p{margin:5px 0 0;color:var(--gray);font-size:13px}

.card,.item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:14px;
}
.form-card{display:none}
.form-card.show{display:block}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.full{grid-column:1/-1}
.form-actions{
  display:flex;
  gap:9px;
  margin-top:16px;
}
.cancel-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:11px 18px;
}
.empty{
  text-align:center;
  padding:45px 20px;
  background:#fff;
  border:1px dashed var(--line);
  border-radius:18px;
  color:var(--gray);
}
.item-title{font-size:18px;font-weight:800}
.item-sub{color:var(--blue);font-size:13px;margin-top:4px}
.item-content{
  margin-top:11px;
  line-height:1.7;
  white-space:pre-wrap;
  color:#47616a;
  font-size:14px;
}
.badge{
  display:inline-block;
  margin-top:8px;
  padding:4px 8px;
  border-radius:7px;
  background:var(--light);
  color:var(--dark);
  font-size:12px;
}
.actions{display:flex;gap:7px;margin-top:14px}
.small-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:7px 11px;
  font-size:13px;
}
.delete-btn{color:var(--danger);border-color:#f4d5d8}
.status{
  display:none;
  background:var(--light);
  color:var(--dark);
  padding:10px 13px;
  border-radius:10px;
  margin-bottom:14px;
  font-size:13px;
}

.song-box{
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-top:10px;
  background:#fbfeff;
}
.song-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.song-number{color:var(--blue);font-weight:800}
.remove-song{
  border:0;
  background:#fff1f2;
  color:var(--danger);
  border-radius:8px;
  padding:6px 9px;
}
.add-song{
  width:100%;
  margin-top:10px;
  border:1px dashed var(--blue);
  background:var(--light);
  color:var(--dark);
  border-radius:11px;
  padding:11px;
  font-weight:700;
}
.photo-preview{display:none;margin-top:10px}
.photo-preview img{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:13px;
  border:1px solid var(--line);
}
.photo-preview.show{display:block}
.photo-note{color:var(--gray);font-size:12px;margin-top:5px}

.language-buttons{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:16px;
}
.language-button{
  flex:none;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:9px 13px;
}
.language-button.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

@media(max-width:650px){
  .container{padding:15px 11px 40px}
  .section-head{flex-direction:column}
  .add-btn{width:100%}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .form-actions button{flex:1}
}
</style>
</head>

<body>

<!-- 登入 -->

<div class="login-page" id="loginPage">
  <div class="login-box">

    <div class="logo">🚪</div>

    <h1>BOYNEXTDOOR</h1>
    <p>記憶資料庫｜管理後台</p>

    <label>管理員帳號</label>
    <input
      class="input"
      id="username"
      type="text"
      autocomplete="username"
      placeholder="輸入管理員帳號"
    >

    <label>管理員密碼</label>
    <input
      class="input"
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="輸入管理員密碼"
    >

    <button class="primary-btn" onclick="login()">
      登入後台
    </button>

    <div class="message" id="loginMessage"></div>

  </div>
</div>


<!-- 後台 -->

<div class="admin-page" id="adminPage">

  <div class="topbar">
    <div>
      <div class="topbar-title">
        BOYNEXTDOOR 記憶資料庫
      </div>
      <div class="topbar-sub">管理後台</div>
    </div>

    <button class="logout" onclick="logout()">登出</button>
  </div>


  <main class="container">

    <div class="tabs">

      <button class="tab active"
        onclick="switchTab('memory',this)">
        📅 日期記憶
      </button>

      <button class="tab"
        onclick="switchTab('members',this)">
        👤 成員
      </button>

      <button class="tab"
        onclick="switchTab('albums',this)">
        💿 專輯
      </button>

      <button class="tab"
        onclick="switchTab('stages',this)">
        🎤 舞台
      </button>

      <button class="tab"
        onclick="switchTab('social',this)">
        📱 社群軟體
      </button>

      <button class="tab"
        onclick="switchTab('languages',this)">
        🌐 語言
      </button>

    </div>

    <div class="status" id="status"></div>


    <!-- 日期記憶 -->

    <section class="panel active" id="memoryPanel">

      <div class="section-head">
        <div>
          <h2>📅 日期記憶</h2>
          <p>有日期的記憶、專輯、舞台、社群紀錄都會集中在這裡。</p>
        </div>

        <button class="add-btn" onclick="openMemoryForm()">
          ＋ 新增記憶
        </button>
      </div>


      <div class="card form-card" id="memoryForm">

        <h3 id="memoryFormTitle">新增記憶</h3>

        <div class="form-grid">

          <div>
            <label>日期</label>
            <input class="input" id="memoryDate" type="date">
          </div>

          <div>
            <label>分類</label>
            <select id="memoryCategory">
              <option>活動</option>
              <option>音樂</option>
              <option>直播</option>
              <option>Weverse</option>
              <option>SNS</option>
              <option>其他</option>
            </select>
          </div>

          <div class="full">
            <label>標題</label>
            <input
              class="input"
              id="memoryTitle"
              placeholder="例如：BOYNEXTDOOR 正式出道"
            >
          </div>

          <div class="full">
            <label>內容</label>
            <textarea
              id="memoryContent"
              placeholder="輸入這一天發生的事情……"
            ></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button class="save-btn" onclick="saveMemory()">儲存</button>
          <button class="cancel-btn" onclick="closeMemoryForm()">取消</button>
        </div>

      </div>

      <div id="memoryList"></div>

    </section>


    <!-- 成員 -->

    <section class="panel" id="membersPanel">

      <div class="section-head">
        <div>
          <h2>👤 成員</h2>
          <p>管理六位成員的完整資料。</p>
        </div>

        <button class="add-btn" onclick="openMemberForm()">
          ＋ 新增成員
        </button>
      </div>


      <div class="card form-card" id="memberForm">

        <h3 id="memberFormTitle">新增成員</h3>

        <div class="form-grid">

          <div>
            <label>韓文姓名</label>
            <input class="input" id="memberKorean">
          </div>

          <div>
            <label>中文姓名</label>
            <input class="input" id="memberChinese">
          </div>

          <div>
            <label>英文姓名</label>
            <input class="input" id="memberEnglish">
          </div>

          <div>
            <label>生日</label>
            <input class="input" id="memberBirth" type="date">
          </div>

          <div>
            <label>身高</label>
            <input class="input" id="memberHeight" placeholder="例如：174 cm">
          </div>

          <div>
            <label>代表 Emoji</label>
            <input class="input" id="memberEmoji">
          </div>

          <div class="full">
            <label>暱稱</label>
            <input class="input" id="memberNickname">
          </div>

          <div class="full">
            <label>成員簡介</label>
            <textarea
              id="memberIntroduction"
              placeholder="輸入成員簡介……"
            ></textarea>
          </div>

          <div class="full">
            <label>TMI</label>
            <textarea
              id="memberTmi"
              placeholder="輸入 TMI……"
            ></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button class="save-btn" onclick="saveMember()">儲存</button>
          <button class="cancel-btn" onclick="closeMemberForm()">取消</button>
        </div>

      </div>

      <div id="memberList"></div>

    </section>


    <!-- 專輯 -->

    <section class="panel" id="albumsPanel">

      <div class="section-head">
        <div>
          <h2>💿 專輯</h2>
          <p>專輯發行日期也會自動進入日期記憶。</p>
        </div>

        <button class="add-btn" onclick="openAlbumForm()">
          ＋ 新增專輯
        </button>
      </div>


      <div class="card form-card" id="albumForm">

        <h3 id="albumFormTitle">新增專輯</h3>

        <div class="form-grid">

          <div>
            <label>專輯名稱</label>
            <input class="input" id="albumName">
          </div>

          <div>
            <label>發行日期</label>
            <input class="input" id="albumDate" type="date">
          </div>

          <div>
            <label>專輯類型</label>
            <input class="input" id="albumType">
          </div>

          <div>
            <label>唱片公司</label>
            <input class="input" id="albumCompany">
          </div>

          <div>
            <label>封面</label>
            <input
              class="input"
              id="albumCover"
              placeholder="圖片網址"
            >

            <div class="photo-preview" id="albumCoverPreview">
              <img id="albumCoverImage">
            </div>
          </div>

          <div>
            <label>製作人</label>
            <input class="input" id="albumProducer">
          </div>

          <div class="full">

            <label>收錄歌曲</label>

            <div id="songList"></div>

            <button
              type="button"
              class="add-song"
              onclick="addSong()">
              ＋ 新增歌曲
            </button>

          </div>

          <div class="full">
            <label>專輯介紹</label>
            <textarea
              id="albumDescription"
              placeholder="輸入專輯介紹……"
            ></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button class="save-btn" onclick="saveAlbum()">儲存</button>
          <button class="cancel-btn" onclick="closeAlbumForm()">取消</button>
        </div>

      </div>

      <div id="albumList"></div>

    </section>


    <!-- 舞台 -->

    <section class="panel" id="stagesPanel">

      <div class="section-head">
        <div>
          <h2>🎤 舞台</h2>
          <p>舞台日期會自動出現在日期記憶。</p>
        </div>

        <button class="add-btn" onclick="openStageForm()">
          ＋ 新增舞台
        </button>
      </div>


      <div class="card form-card" id="stageForm">

        <h3 id="stageFormTitle">新增舞台</h3>

        <div class="form-grid">

          <div>
            <label>日期</label>
            <input class="input" id="stageDate" type="date">
          </div>

          <div>
            <label>節目／活動</label>
            <input class="input" id="stageProgram">
          </div>

          <div>
            <label>表演歌曲</label>
            <input class="input" id="stageSong">
          </div>

          <div>
            <label>影片連結</label>
            <input class="input" id="stageLink" type="url">
          </div>

          <div class="full">
            <label>舞台內容</label>
            <textarea
              id="stageDescription"
              placeholder="輸入舞台相關內容……"
            ></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button class="save-btn" onclick="saveStage()">儲存</button>
          <button class="cancel-btn" onclick="closeStageForm()">取消</button>
        </div>

      </div>

      <div id="stageList"></div>

    </section>


    <!-- 社群軟體 -->

    <section class="panel" id="socialPanel">

      <div class="section-head">
        <div>
          <h2>📱 社群軟體</h2>
          <p>每筆社群紀錄都有日期、平台、照片、網址與文字。</p>
        </div>

        <button class="add-btn" onclick="openSocialForm()">
          ＋ 新增社群紀錄
        </button>
      </div>


      <div class="card form-card" id="socialForm">

        <h3 id="socialFormTitle">新增社群紀錄</h3>

        <div class="form-grid">

          <div>
            <label>日期</label>
            <input class="input" id="socialDate" type="date">
          </div>

          <div>
            <label>平台</label>
            <select id="socialPlatform">
              <option>YouTube</option>
              <option>Weverse</option>
              <option>X</option>
              <option>Instagram</option>
              <option>TikTok</option>
              <option>抖音</option>
            </select>
          </div>

          <div class="full">

            <label>網址</label>

            <input
              class="input"
              id="socialLink"
              type="url"
              placeholder="貼上這篇社群貼文的網址"
            >

          </div>

          <div class="full">

            <label>照片網址</label>

            <input
              class="input"
              id="socialPhoto"
              type="url"
              placeholder="圖片網址"
            >

            <div class="photo-preview" id="socialPhotoPreview">
              <img id="socialPhotoImage">
            </div>

            <div class="photo-note">
              目前照片使用圖片網址；之後可以再加入手機直接上傳照片。
            </div>

          </div>

          <div class="full">

            <label>文字</label>

            <textarea
              id="socialText"
              placeholder="輸入社群貼文內容……"
            ></textarea>

          </div>

        </div>

        <div class="form-actions">
          <button class="save-btn" onclick="saveSocial()">儲存</button>
          <button class="cancel-btn" onclick="closeSocialForm()">取消</button>
        </div>

      </div>

      <div id="socialList"></div>

    </section>


    <!-- 語言 -->

    <section class="panel" id="languagesPanel">

      <div class="section-head">
        <div>
          <h2>🌐 語言</h2>
          <p>完整的整站語言切換之後再製作。</p>
        </div>
      </div>

      <div class="card">

        <div class="language-buttons">

          <button
            class="language-button active"
            onclick="selectLanguage('zh-Hant',this)">
            繁中
          </button>

          <button
            class="language-button"
            onclick="selectLanguage('zh-Hans',this)">
            简中
          </button>

          <button
            class="language-button"
            onclick="selectLanguage('en',this)">
            English
          </button>

          <button
            class="language-button"
            onclick="selectLanguage('ja',this)">
            日本語
          </button>

          <button
            class="language-button"
            onclick="selectLanguage('ko',this)">
            한국어
          </button>

        </div>

        <label>網站名稱</label>
        <input
          class="input"
          id="languageSiteName"
          placeholder="BOYNEXTDOOR 記憶資料庫"
        >

        <label>網站介紹</label>
        <textarea
          id="languageDescription"
          placeholder="輸入網站介紹……"
        ></textarea>

        <div class="form-actions">
          <button class="save-btn" onclick="saveLanguage()">
            儲存
          </button>
        </div>

      </div>

    </section>

  </main>
</div>


<script>

let siteData={
  memory:[],
  members:[],
  albums:[],
  stages:[],
  social:[],
  languages:{
    "zh-Hant":{},
    "zh-Hans":{},
    "en":{},
    "ja":{},
    "ko":{}
  }
};

let editingMemoryIndex=-1;
let editingMemberIndex=-1;
let editingAlbumIndex=-1;
let editingStageIndex=-1;
let editingSocialIndex=-1;
let currentLanguage="zh-Hant";


/* 登入 */

async function login(){

  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  const message=document.getElementById("loginMessage");

  message.textContent="";

  if(!username||!password){
    message.textContent="請輸入帳號和密碼。";
    return;
  }

  try{

    const response=await fetch("/api/admin",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      credentials:"include",
      body:JSON.stringify({
        action:"login",
        username,
        password
      })
    });

    const result=await response.json();

    if(!response.ok){
      message.textContent=result.message||"登入失敗。";
      return;
    }

    await loadData();

    document.getElementById("loginPage").style.display="none";
    document.getElementById("adminPage").style.display="block";

  }catch(error){

    console.error(error);
    message.textContent="無法連接伺服器，請稍後再試。";

  }
}


/* 載入資料 */

async function loadData(){

  const response=await fetch("/api/admin",{
    credentials:"include"
  });

  const result=await response.json();

  if(!response.ok){
    throw new Error(result.message||"資料載入失敗");
  }

  siteData=result.data||siteData;

  siteData.memory=Array.isArray(siteData.memory)
    ?siteData.memory:[];

  siteData.members=Array.isArray(siteData.members)
    ?siteData.members:[];

  siteData.albums=Array.isArray(siteData.albums)
    ?siteData.albums:[];

  siteData.stages=Array.isArray(siteData.stages)
    ?siteData.stages:[];

  siteData.social=Array.isArray(siteData.social)
    ?siteData.social:[];

  if(!siteData.languages){
    siteData.languages={};
  }

  renderAll();
}


/* 儲存 */

async function saveSiteData(){

  const response=await fetch("/api/admin",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    credentials:"include",
    body:JSON.stringify({
      action:"save",
      data:siteData

function renderMemory(){

  const list=document.getElementById("memoryList");

  const records=[];

  siteData.memory.forEach((item,index)=>{
    records.push({
      date:item.date,
      type:"📖 記憶",
      title:item.title,
      content:item.content,
      source:"memory",
      index
    });
  });

  siteData.albums.forEach(item=>{
    if(item.date){
      records.push({
        date:item.date,
        type:"💿 專輯",
        title:item.name||"專輯",
        content:item.description||"",
        source:"album"
      });
    }
  });

  siteData.stages.forEach((item,index)=>{
    if(item.date){
      records.push({
        date:item.date,
        type:"🎤 舞台",
        title:item.program||item.song||"舞台",
        content:[
          item.song?"歌曲："+item.song:"",
          item.description||""
        ].filter(Boolean).join("\n"),
        source:"stage",
        index
      });
    }
  });

  siteData.social.forEach((item,index)=>{
    if(item.date){
      records.push({
        date:item.date,
        type:"📱 "+(item.platform||"社群"),
        title:item.platform||"社群紀錄",
        content:item.text||"",
        source:"social",
        index
      });
    }
  });

  siteData.members.forEach(item=>{
    if(item.birth){
      records.push({
        date:item.birth,
        type:"🎂 成員生日",
        title:(item.chinese||item.english||"成員")+" 生日",
        content:item.introduction||"",
        source:"member"
      });
    }
  });

  if(!records.length){

    list.innerHTML=`
      <div class="empty">
        <div style="font-size:35px">📖</div>
        <strong>目前還沒有日期資料</strong>
        <div style="margin-top:7px">
          有日期的資料都會出現在這裡。
        </div>
      </div>
    `;

    return;
  }

  records.sort((a,b)=>
    String(b.date).localeCompare(String(a.date))
  );

  list.innerHTML=records.map(item=>`

    <div class="item">

      <div class="item-sub">
        ${escapeHtml(formatDate(item.date))}
      </div>

      <div class="item-title">
        ${escapeHtml(item.title)}
      </div>

      <span class="badge">
        ${escapeHtml(item.type)}
      </span>

      ${
        item.content
        ?`
          <div class="item-content">
            ${escapeHtml(item.content)}
          </div>
        `
        :""
      }

      ${
        item.source==="memory"
        ?`
          <div class="actions">

            <button
              class="small-btn"
              onclick="openMemoryForm(${item.index})">
              ✏️ 編輯
            </button>

            <button
              class="small-btn delete-btn"
              onclick="deleteMemory(${item.index})">
              🗑️ 刪除
            </button>

          </div>
        `
        :""
      }

    </div>

  `).join("");
}

          ✏️ 編輯
        </button>

        <button
          class="small-btn delete-btn"
          onclick="deleteSocial(${index})">
          🗑️ 刪除
        </button>

      </div>

    </div>

  `).join("");
}


/* 語言 */

function selectLanguage(language,button){

  currentLanguage=language;

  document.querySelectorAll(".language-button")
    .forEach(item=>item.classList.remove("active"));

  button.classList.add("active");

  loadLanguage();
}


function loadLanguage(){

  if(!siteData.languages){
    siteData.languages={};
  }

  if(!siteData.languages[currentLanguage]){
    siteData.languages[currentLanguage]={};
  }

  const data=siteData.languages[currentLanguage];

  document.getElementById("languageSiteName").value=
    data.siteName||"";

  document.getElementById("languageDescription").value=
    data.description||"";
}


async function saveLanguage(){

  if(!siteData.languages){
    siteData.languages={};
  }

  siteData.languages[currentLanguage]={

    siteName:
      document.getElementById("languageSiteName").value.trim(),

    description:
      document.getElementById("languageDescription").value.trim()

  };

  try{

    await saveSiteData();
    showStatus("語言內容已儲存！");

  }catch(error){
    alert("儲存失敗："+error.message);
  }
}


/* 圖片預覽 */

document
  .getElementById("albumCover")
  .addEventListener("input",updateCoverPreview);

document
  .getElementById("socialPhoto")
  .addEventListener("input",updateSocialPhotoPreview);


function updateCoverPreview(){

  const url=document.getElementById("albumCover").value.trim();
  const preview=document.getElementById("albumCoverPreview");
  const image=document.getElementById("albumCoverImage");

  if(url){

    image.src=url;
    preview.classList.add("show");

  }else{

    image.removeAttribute("src");
    preview.classList.remove("show");

  }
}


function updateSocialPhotoPreview(){

  const url=document.getElementById("socialPhoto").value.trim();
  const preview=document.getElementById("socialPhotoPreview");
  const image=document.getElementById("socialPhotoImage");

  if(url){

    image.src=url;
    preview.classList.add("show");

  }else{

    image.removeAttribute("src");
    preview.classList.remove("show");

  }
}


/* 工具 */

function formatDate(date){

  if(!date)return"";

  const parts=date.split("-");

  if(parts.length!==3)return date;

  return `${parts[0]}/${parts[1]}/${parts[2]}`;
}


function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


function showStatus(text){

  const status=document.getElementById("status");

  status.textContent=text;
  status.style.display="block";

  setTimeout(()=>{
    status.style.display="none";
  },2500);
}


/* 登出 */

async function logout(){

  try{

    await fetch("/api/admin",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      credentials:"include",
      body:JSON.stringify({
        action:"logout"
      })
    });

  }catch(error){
    console.error(error);
  }

  location.reload();
}
