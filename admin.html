<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOYNEXTDOOR 記憶資料庫｜管理後台</title>

<style>
:root{
  --blue:#01A3DB;
  --blue-dark:#08799f;
  --blue-light:#eaf9ff;
  --bg:#f5fbfd;
  --white:#fff;
  --text:#17343e;
  --gray:#71868e;
  --line:#dcecf2;
  --danger:#e85d68;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
  "PingFang TC","Microsoft JhengHei",sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
  background:linear-gradient(135deg,#eafaff,#f7fcfe);
}

.login-box{
  width:100%;
  max-width:420px;
  padding:30px 24px;
  background:white;
  border-radius:26px;
  box-shadow:0 15px 45px rgba(1,163,219,.12);
}

.logo{
  width:62px;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:19px;
  background:var(--blue);
  color:white;
  font-size:28px;
  margin-bottom:18px;
}

.login-box h1{
  margin:0 0 7px;
  font-size:24px;
}

.login-box p{
  color:var(--gray);
  font-size:14px;
  margin:0 0 25px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fbfeff;
  padding:12px 13px;
  outline:none;
}

.input{
  margin-bottom:16px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.input:focus,
textarea:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(1,163,219,.1);
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  background:var(--blue);
  color:white;
  font-weight:800;
}

.message{
  margin-top:13px;
  text-align:center;
  color:var(--danger);
  font-size:14px;
}

/* ADMIN */

.admin-page{
  display:none;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 18px;
  background:white;
  border-bottom:1px solid var(--line);
}

.topbar-title{
  font-size:16px;
  font-weight:800;
}

.topbar-sub{
  color:var(--gray);
  font-size:12px;
  margin-top:3px;
}

.logout{
  border:1px solid var(--line);
  background:white;
  color:var(--gray);
  border-radius:10px;
  padding:8px 12px;
}

.container{
  width:min(1100px,100%);
  margin:auto;
  padding:18px 14px 50px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
  margin-bottom:18px;
}

.tab{
  flex:none;
  border:1px solid var(--line);
  background:white;
  color:var(--gray);
  border-radius:12px;
  padding:10px 14px;
}

.tab.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:18px;
}

.section-head h2{
  margin:0;
  font-size:22px;
}

.section-head p{
  margin:5px 0 0;
  color:var(--gray);
  font-size:13px;
}

.add-btn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:12px;
  padding:11px 15px;
  font-weight:800;
}

.card,
.item{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:13px;
}

.form-card{
  display:none;
}

.form-card.show{
  display:block;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.form-actions{
  display:flex;
  gap:9px;
  margin-top:16px;
}

.save-btn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:11px;
  padding:11px 18px;
  font-weight:800;
}

.cancel-btn{
  border:1px solid var(--line);
  background:white;
  border-radius:11px;
  padding:11px 18px;
}

.item-title{
  font-size:17px;
  font-weight:800;
}

.item-sub{
  color:var(--blue);
  font-size:13px;
  margin-top:4px;
}

.item-content{
  margin-top:10px;
  color:#47616a;
  line-height:1.7;
  white-space:pre-wrap;
  font-size:14px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  background:var(--blue-light);
  color:var(--blue-dark);
  border-radius:7px;
  padding:4px 8px;
  font-size:12px;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.small-btn{
  border:1px solid var(--line);
  background:white;
  border-radius:9px;
  padding:7px 11px;
  font-size:13px;
}

.delete-btn{
  color:var(--danger);
  border-color:#f4d5d8;
}

.empty{
  text-align:center;
  padding:45px 20px;
  background:white;
  border:1px dashed var(--line);
  border-radius:18px;
  color:var(--gray);
}

.status{
  display:none;
  margin-bottom:14px;
  background:var(--blue-light);
  color:var(--blue-dark);
  padding:10px 13px;
  border-radius:10px;
  font-size:13px;
}

/* LANGUAGE */

.language-box{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}

.language-buttons{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
}

.language-button{
  flex:none;
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:9px 13px;
}

.language-button.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

@media(max-width:650px){

  .topbar{
    padding:13px;
  }

  .container{
    padding:15px 11px 40px;
  }

  .section-head{
    flex-direction:column;
  }

  .add-btn{
    width:100%;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .form-actions button{
    flex:1;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

  <div class="login-box">

    <div class="logo">🚪</div>

    <h1>BOYNEXTDOOR</h1>

    <p>記憶資料庫｜管理後台</p>

    <label>管理員帳號</label>

    <input
      class="input"
      id="username"
      type="text"
      autocomplete="username"
      placeholder="輸入管理員帳號"
    >

    <label>管理員密碼</label>

    <input
      class="input"
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="輸入管理員密碼"
    >

    <button class="primary-btn" onclick="login()">
      登入後台
    </button>

    <div class="message" id="loginMessage"></div>

  </div>

</div>


<!-- ADMIN -->

<div class="admin-page" id="adminPage">

  <div class="topbar">

    <div>
      <div class="topbar-title">
        BOYNEXTDOOR 記憶資料庫
      </div>

      <div class="topbar-sub">
        管理後台
      </div>
    </div>

    <button class="logout" onclick="logout()">
      登出
    </button>

  </div>


  <main class="container">

    <div class="tabs">

      <button class="tab active"
        onclick="switchTab('memory',this)">
        📅 記憶資料
      </button>

      <button class="tab"
        onclick="switchTab('members',this)">
        👤 成員
      </button>

      <button class="tab"
        onclick="switchTab('albums',this)">
        💿 專輯
      </button>

      <button class="tab"
        onclick="switchTab('stages',this)">
        🎤 舞台
      </button>

      <button class="tab"
        onclick="switchTab('social',this)">
        📱 SNS
      </button>

      <button class="tab"
        onclick="switchTab('languages',this)">
        🌐 語言
      </button>

    </div>


    <!-- MEMORY -->

    <section class="panel active" id="memoryPanel">

      <div class="section-head">

        <div>
          <h2>📅 記憶資料</h2>
          <p>管理 BOYNEXTDOOR 歷史事件</p>
        </div>

        <button class="add-btn"
          onclick="openMemoryForm()">
          ＋ 新增記憶
        </button>

      </div>

      <div class="status" id="status"></div>

      <div class="card form-card" id="memoryForm">

        <h3 id="memoryFormTitle">新增記憶</h3>

        <div class="form-grid">

          <div>
            <label>日期</label>
            <input
              class="input"
              id="memoryDate"
              type="date"
            >
          </div>

          <div>
            <label>分類</label>

            <select id="memoryCategory">

              <option>活動</option>
              <option>音樂</option>
              <option>舞台</option>
              <option>直播</option>
              <option>SNS</option>
              <option>Weverse</option>
              <option>採訪</option>
              <option>其他</option>

            </select>

          </div>

          <div class="full">

            <label>標題</label>

            <input
              class="input"
              id="memoryTitle"
              placeholder="例如：BOYNEXTDOOR 正式出道"
            >

          </div>

          <div class="full">

            <label>內容</label>

            <textarea
              id="memoryContent"
              placeholder="輸入事件內容……"
            ></textarea>

          </div>

          <div class="full">

            <label>相關連結</label>

            <input
              class="input"
              id="memoryLink"
              placeholder="https://..."
            >

          </div>

        </div>

        <div class="form-actions">

          <button class="save-btn"
            onclick="saveMemory()">
            儲存
          </button>

          <button class="cancel-btn"
            onclick="closeMemoryForm()">
            取消
          </button>

        </div>

      </div>

      <div id="memoryList"></div>

    </section>


    <!-- MEMBERS -->

    <section class="panel" id="membersPanel">

      <div class="section-head">

        <div>
          <h2>👤 成員</h2>
          <p>管理六位成員資料</p>
        </div>

        <button class="add-btn"
          onclick="openMemberForm()">
          ＋ 新增成員
        </button>

      </div>

      <div class="card form-card" id="memberForm">

        <h3 id="memberFormTitle">新增成員</h3>

        <div class="form-grid">

          <div>
            <label>韓文姓名</label>

            <input
              class="input"
              id="memberKorean"
              placeholder="例如：성호"
            >
          </div>

          <div>
            <label>中文姓名</label>

            <input
              class="input"
              id="memberChinese"
              placeholder="例如：成淏"
            >
          </div>

          <div>
            <label>英文姓名</label>

            <input
              class="input"
              id="memberEnglish"
              placeholder="例如：SUNGHO"
            >
          </div>

          <div>
            <label>生日</label>

            <input
              class="input"
              id="memberBirth"
              type="date"
            >
          </div>

          <div>
            <label>身高</label>

            <input
              class="input"
              id="memberHeight"
              placeholder="例如：174 cm"
            >
          </div>

          <div>
            <label>代表 Emoji</label>

            <input
              class="input"
              id="memberEmoji"
              placeholder="例如：🐶"
            >
          </div>

          <div class="full">

            <label>TMI</label>

            <textarea
              id="memberTmi"
              placeholder="輸入成員 TMI……"
            ></textarea>

          </div>

        </div>

        <div class="form-actions">

          <button class="save-btn"
            onclick="saveMember()">
            儲存
          </button>

          <button class="cancel-btn"
            onclick="closeMemberForm()">
            取消
          </button>

        </div>

      </div>

      <div id="memberList"></div>

    </section>


    <!-- ALBUMS -->

    <section class="panel" id="albumsPanel">

      <div class="section-head">

        <div>
          <h2>💿 專輯</h2>
          <p>管理歷代專輯資料</p>
        </div>

        <button class="add-btn"
          onclick="openAlbumForm()">
          ＋ 新增專輯
        </button>

      </div>

      <div class="card form-card" id="albumForm">

        <h3 id="albumFormTitle">新增專輯</h3>

        <div class="form-grid">

          <div>
            <label>專輯名稱</label>

            <input
              class="input"
              id="albumName"
              placeholder="例如：WHO!"
            >
          </div>

          <div>
            <label>發行日期</label>

            <input
              class="input"
              id="albumDate"
              type="date"
            >
          </div>

          <div>
            <label>專輯類型</label>

            <input
              class="input"
              id="albumType"
              placeholder="例如：Single Album"
            >
          </div>

          <div>
            <label>封面圖片網址</label>

            <input
              class="input"
              id="albumCover"
              placeholder="https://..."
            >
          </div>

          <div class="full">

            <label>收錄歌曲</label>

            <textarea
              id="albumSongs"
              placeholder="一行一首歌曲"
            ></textarea>

          </div>

          <div class="full">

            <label>專輯介紹</label>

            <textarea
              id="albumDescription"
              placeholder="輸入專輯介紹……"
            ></textarea>

          </div>

        </div>

        <div class="form-actions">

          <button class="save-btn"
            onclick="saveAlbum()">
            儲存
          </button>

          <button class="cancel-btn"
            onclick="closeAlbumForm()">
            取消
          </button>

        </div>

      </div>

      <div id="albumList"></div>

    </section>


    <!-- STAGES -->

    <section class="panel" id="stagesPanel">

      <div class="section-head">

        <div>
          <h2>🎤 舞台</h2>
          <p>管理歷史舞台與表演</p>
        </div>

        <button class="add-btn"
          onclick="openStageForm()">
          ＋ 新增舞台
        </button>

      </div>

      <div class="card form-card" id="stageForm">

        <h3 id="stageFormTitle">新增舞台</h3>

        <div class="form-grid">

          <div>
            <label>日期</label>

            <input
              class="input"
              id="stageDate"
              type="date"
            >
          </div>

          <div>
            <label>節目／活動</label>

            <input
              class="input"
              id="stageProgram"
              placeholder="例如：M COUNTDOWN"
            >
          </div>

          <div>
            <label>表演歌曲</label>

            <input
              class="input"
              id="stageSong"
              placeholder="例如：Earth, Wind & Fire"
            >
          </div>

          <div>
            <label>影片連結</label>

            <input
              class="input"
              id="stageLink"
              placeholder="https://..."
            >
          </div>

          <div class="full">

            <label>舞台備註</label>

            <textarea
              id="stageDescription"
              placeholder="輸入舞台相關內容……"
            ></textarea>

          </div>

        </div>

        <div class="form-actions">

          <button class="save-btn"
            onclick="saveStage()">
            儲存
          </button>

          <button class="cancel-btn"
            onclick="closeStageForm()">
            取消
          </button>

        </div>

      </div>

      <div id="stageList"></div>

    </section>


    <!-- SOCIAL -->

    <section class="panel" id="socialPanel">

      <div class="section-head">

        <div>
          <h2>📱 SNS</h2>
          <p>管理官方社群連結</p>
        </div>

        <button class="add-btn"
          onclick="openSocialForm()">
          ＋ 新增 SNS
        </button>

      </div>

      <div class="card form-card" id="socialForm">

        <h3 id="socialFormTitle">新增 SNS</h3>

        <div class="form-grid">

          <div>
            <label>平台</label>

            <select id="socialPlatform">

              <option>YouTube</option>
              <option>Weverse</option>
              <option>X</option>
              <option>Instagram</option>
              <option>TikTok</option>
              <option>抖音</option>

            </select>

          </div>

          <div>
            <label>名稱</label>

            <input
              class="input"
              id="socialName"
              placeholder="例如：BOYNEXTDOOR Official"
            >
          </div>

          <div class="full">

            <label>網址</label>

            <input
              class="input"
              id="socialUrl"
              placeholder="https://..."
            >

          </div>

        </div>

        <div class="form-actions">

          <button class="save-btn"
            onclick="saveSocial()">
            儲存
          </button>

          <button class="cancel-btn"
            onclick="closeSocialForm()">
            取消
          </button>

        </div>

      </div>

      <div id="socialList"></div>

    </section>


    <!-- LANGUAGES -->

    <section class="panel" id="languagesPanel">

      <div class="section-head">

        <div>
          <h2>🌐 語言</h2>
          <p>管理網站五種語言的文字</p>
        </div>

      </div>

      <div class="language-box">

        <div class="language-buttons">

          <button class="language-button active"
            onclick="selectLanguage('zh-Hant',this)">
            繁中
          </button>

          <button class="language-button"
            onclick="selectLanguage('zh-Hans',this)">
            简中
          </button>

          <button class="language-button"
            onclick="selectLanguage('en',this)">
            English
          </button>

          <button class="language-button"
            onclick="selectLanguage('ja',this)">
            日本語
          </button>

          <button class="language-button"
            onclick="selectLanguage('ko',this)">
            한국어
          </button>

        </div>

        <label>網站名稱</label>

        <input
          class="input"
          id="languageSiteName"
          placeholder="BOYNEXTDOOR 記憶資料庫"
        >

        <label>網站介紹</label>

        <textarea
          id="languageDescription"
          placeholder="輸入網站介紹……"
        ></textarea>

        <div class="form-actions">

          <button class="save-btn"
            onclick="saveLanguage()">
            儲存語言內容
          </button>

        </div>

      </div>

    </section>

  </main>

</div>


<script>

let siteData={
  memory:[],
  members:[],
  albums:[],
  stages:[],
  social:[],
  languages:{
    "zh-Hant":{},
    "zh-Hans":{},
    "en":{},
    "ja":{},
    "ko":{}
  }
};

let editingMemoryIndex=-1;
let editingMemberIndex=-1;
let editingAlbumIndex=-1;
let editingStageIndex=-1;
let editingSocialIndex=-1;

let currentLanguage="zh-Hant";


/* LOGIN */

async function login(){

  const username=
    document.getElementById("username").value.trim();

  const password=
    document.getElementById("password").value;

  const message=
    document.getElementById("loginMessage");

  message.textContent="";

  if(!username||!password){

    message.textContent="請輸入帳號和密碼。";
    return;

  }

  try{

    const response=
      await fetch("/api/admin",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        credentials:"include",

        body:JSON.stringify({
          action:"login",
          username,
          password
        })

      });

    const result=
      await response.json();

    if(!response.ok){

      message.textContent=
        result.message||"登入失敗。";

      return;

    }

    await loadData();

    document.getElementById("loginPage")
      .style.display="none";

    document.getElementById("adminPage")
      .style.display="block";

  }catch(error){

    console.error(error);

    message.textContent=
      "無法連接伺服器，請稍後再試。";

  }

}


/* LOAD */

async function loadData(){

  const response=
    await fetch("/api/admin?action=data",{
      credentials:"include"
    });

  const result=
    await response.json();

  if(!response.ok){

    throw new Error(
      result.message||"資料載入失敗"
    );

  }

  siteData=result.data||siteData;

  siteData.memory=
    Array.isArray(siteData.memory)
      ?siteData.memory
      :[];

  siteData.members=
    Array.isArray(siteData.members)
      ?siteData.members
      :[];

  siteData.albums=
    Array.isArray(siteData.albums)
      ?siteData.albums
      :[];

  siteData.stages=
    Array.isArray(siteData.stages)
      ?siteData.stages
      :[];

  siteData.social=
    Array.isArray(siteData.social)
      ?siteData.social
      :[];

  if(!siteData.languages){
    siteData.languages={};
  }

  renderAll();

}


/* SAVE */

async function saveSiteData(){

  const response=
    await fetch("/api/admin",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body:JSON.stringify({
        action:"save",
        data:siteData

  button.classList.add("active");

function loadLanguage(){

  if(!siteData.languages){
    siteData.languages={};
  }

  if(!siteData.languages[currentLanguage]){
    siteData.languages[currentLanguage]={};
  }

  const data=
    siteData.languages[currentLanguage];

  document.getElementById("languageSiteName").value=
    data.siteName||"";

  document.getElementById("languageDescription").value=
    data.description||"";

}


async function saveLanguage(){

  if(!siteData.languages){
    siteData.languages={};
  }

  siteData.languages[currentLanguage]={

    siteName:
      document.getElementById("languageSiteName").value.trim(),

    description:

  };

  try{

}


/* STATUS */

function showStatus(text){

  const element=
    document.getElementById("status");

  element.textContent=text;
  element.style.display="block";

  setTimeout(()=>{
    element.style.display="none";
  },2500);

}


/* DATE */

function formatDate(date){

  if(!date) return "";

  const parts=date.split("-");

  if(parts.length!==3) return date;

  return `${parts[0]}/${parts[1]}/${parts[2]}`;

}


/* ESCAPE */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* LOGOUT */

async function logout(){

  try{

    await fetch("/api/admin",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body:JSON.stringify({
        action:"logout"
      })

    });

  }catch(error){

    console.error(error);

  }

  location.reload();

}
